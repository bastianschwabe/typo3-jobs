<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:spaceless>
<!DOCTYPE html>
<html lang="{language.locale.languageCode}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{page.pageRecord.title} – {language.websiteTitle}</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; font: 16px/1.6 system-ui, sans-serif; }
        .wrap { max-width: 62rem; margin: 0 auto; padding: 1.5rem; }
        header { border-bottom: 1px solid currentColor; margin-bottom: 2rem; }
        nav ul { display: flex; gap: 1rem; list-style: none; padding: 0; }
        nav a[aria-current] { font-weight: 700; }
        .jobs-list__items { list-style: none; padding: 0; display: grid; gap: 1.5rem; }
        .job-teaser { border: 1px solid currentColor; border-radius: .5rem; padding: 1rem 1.25rem; }
        .job-meta { display: flex; flex-wrap: wrap; gap: 1.5rem; margin: .75rem 0; }
        .job-meta dt { font-size: .75rem; text-transform: uppercase; opacity: .7; }
        .job-meta dd { margin: 0; }
        .jobs-filter fieldset { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; border-radius: .5rem; }
        .jobs-filter__field { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <nav aria-label="Main">
                <ul>
                    <f:for each="{mainMenu}" as="item">
                        <li><a href="{item.link}" aria-current="{f:if(condition: item.active, then: 'page')}">{item.title}</a></li>
                    </f:for>
                </ul>
            </nav>
            <nav aria-label="Language">
                <ul>
                    <f:for each="{languageMenu}" as="item">
                        <li>
                            <f:if condition="{item.available}">
                                <f:then><a href="{item.link}" hreflang="{item.hreflang}" aria-current="{f:if(condition: item.active, then: 'true')}">{item.navigationTitle}</a></f:then>
                                <f:else><span style="opacity:.4">{item.navigationTitle}</span></f:else>
                            </f:if>
                        </li>
                    </f:for>
                </ul>
            </nav>
        </header>

        <main>
            <f:render section="Main" />
        </main>
    </div>
</body>
</html>
</f:spaceless>
</html>
