<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<f:variable name="demandArguments" value="{
    level: demand.level,
    occupationalField: demand.occupationalField,
    location: demand.location,
    employmentType: demand.employmentType,
    remoteOnly: demand.remoteOnly,
    search: demand.search
}" />

<f:if condition="{pagination.lastPageNumber} > 1">
    <nav class="jobs-pagination" aria-label="{f:translate(key: 'pagination.label', domain: 'jobs.messages')}">
        <ul class="jobs-pagination__list">
            <f:if condition="{pagination.previousPageNumber}">
                <li class="jobs-pagination__item">
                    <f:link.action action="list" rel="prev" class="jobs-pagination__link jobs-pagination__link--prev"
                                   arguments="{currentPage: pagination.previousPageNumber, demand: demandArguments}"
                                   aria-label="{f:translate(key: 'pagination.previous', domain: 'jobs.messages')}">&lsaquo;</f:link.action>
                </li>
            </f:if>

            <f:for each="{pagination.allPageNumbers}" as="page">
                <li class="jobs-pagination__item">
                    <f:link.action action="list" class="jobs-pagination__link"
                                   arguments="{currentPage: page, demand: demandArguments}"
                                   aria-current="{f:if(condition: '{page} == {paginator.currentPageNumber}', then: 'page')}">{page}</f:link.action>
                </li>
            </f:for>

            <f:if condition="{pagination.nextPageNumber}">
                <li class="jobs-pagination__item">
                    <f:link.action action="list" rel="next" class="jobs-pagination__link jobs-pagination__link--next"
                                   arguments="{currentPage: pagination.nextPageNumber, demand: demandArguments}"
                                   aria-label="{f:translate(key: 'pagination.next', domain: 'jobs.messages')}">&rsaquo;</f:link.action>
                </li>
            </f:if>
        </ul>
    </nav>
</f:if>

</html>
