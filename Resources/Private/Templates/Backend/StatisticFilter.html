<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<f:layout name="Module" />

<f:section name="Content">
    <f:asset.css identifier="jobs-backend" href="EXT:jobs/Resources/Public/Css/Backend.css" />

    <h1><f:translate key="title" domain="jobs.modules.statistics" /> &ndash; <f:translate key="statistic.view.filter" domain="jobs.backend" /></h1>

    <f:if condition="!{trackingEnabled}">
        <f:render partial="Backend/DisabledNotice" arguments="{settingsUrl: settingsUrl}" />
    </f:if>

    <div class="{f:if(condition: '!{trackingEnabled}', then: 'jobs-disabled')}" {f:if(condition: '!{trackingEnabled}', then: 'aria-disabled="true"')}>
        <p class="text-body-secondary"><f:translate key="statistic.filter.intro" domain="jobs.backend" /></p>

        <f:if condition="{filters}">
            <f:then>
                <div class="table-fit">
                    <table class="table table-striped table-hover jobs-table">
                        <thead>
                            <tr>
                                <th><f:translate key="statistic.filter.column.search" domain="jobs.backend" /></th>
                                <th><f:translate key="statistic.filter.column.level" domain="jobs.backend" /></th>
                                <th><f:translate key="statistic.filter.column.occupationalField" domain="jobs.backend" /></th>
                                <th><f:translate key="statistic.filter.column.location" domain="jobs.backend" /></th>
                                <th><f:translate key="statistic.filter.column.employmentType" domain="jobs.backend" /></th>
                                <th><f:translate key="statistic.filter.column.remote" domain="jobs.backend" /></th>
                                <th class="text-end"><f:translate key="statistic.filter.column.count" domain="jobs.backend" /></th>
                                <th class="text-end"><f:translate key="statistic.filter.column.averageResults" domain="jobs.backend" /></th>
                                <th><f:translate key="statistic.filter.column.lastUsed" domain="jobs.backend" /></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{filters}" as="filter">
                                <tr>
                                    <td><f:if condition="{filter.search}">&ldquo;{filter.search}&rdquo;</f:if></td>
                                    <td>{filter.level}</td>
                                    <td>{filter.occupationalField}</td>
                                    <td>{filter.location}</td>
                                    <td><f:if condition="{filter.employmentType}"><f:translate key="employment_type.{filter.employmentType}" domain="jobs.db" default="{filter.employmentType}" /></f:if></td>
                                    <td><f:if condition="{filter.remoteOnly}"><span class="badge badge-info"><f:translate key="statistic.filter.remoteOnly" domain="jobs.backend" /></span></f:if></td>
                                    <td class="text-end"><strong>{filter.count}</strong></td>
                                    <td class="text-end">{filter.averageResults -> f:format.number(decimals: 1)}</td>
                                    <td>{filter.lastUsedAt -> f:format.date(format: 'Y-m-d H:i')}</td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:be.infobox state="-1" title="{f:translate(key: 'statistic.filter.empty.title', domain: 'jobs.backend')}">
                    <f:translate key="statistic.filter.empty.message" domain="jobs.backend" />
                </f:be.infobox>
            </f:else>
        </f:if>
    </div>
</f:section>

</html>
